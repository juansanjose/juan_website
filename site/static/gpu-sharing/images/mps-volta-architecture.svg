<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="mps-title mps-desc" style="font-family:Arial,Helvetica,sans-serif">
<title id="mps-title">MPS on Volta and newer GPUs</title><desc id="mps-desc">Clients A and B each own their CUDA context, GPU address space and allocated connections. Solid arrows submit work directly to GPU work queues and the hardware scheduler. A and B share SMs. Dashed lines connect the separate MPS control daemon and server to the clients for coordination and cleanup.</desc>
<defs><linearGradient id="mps-panel" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eef5f7"/></linearGradient><marker id="mps-arrow" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#172b3a"/></marker></defs>
<rect width="1000" height="740" fill="#f7fafb"/>
