2b3a" stroke-width="2.5" marker-end="url(#mps-arrow)"/><text x="235" y="347" text-anchor="middle" font-size="17" fill="#172b3a" >Direct GPU</text><text x="235" y="369" text-anchor="middle" font-size="17" fill="#172b3a" >submission</text><path d="M480 306 V416" fill="none" stroke="#172b3a" stroke-width="2.5" marker-end="url(#mps-arrow)"/><text x="545" y="347" text-anchor="middle" font-size="17" fill="#172b3a" >Direct GPU</text><text x="545" y="369" text-anchor="middle" font-size="17" fill="#172b3a" >submission</text><rect x="50" y="418" width="240" height="44" rx="10" fill="#f5d4de" stroke="#f46b68" stroke-width="2" /><text x="170" y="447" text-anchor="middle" font-size="22" fill="#172b3a" >Work queues A</text><rect x="360" y="418" width="240" height="44" rx="10" fill="#e3efc7" stroke="#8fbd60" stroke-width="2" /><text x="480" y="447" text-anchor="middle" font-size="22" fill="#172b3a" >Work queues B</text><path d="M170 464 L285 498" fill="none" stroke="#172b3a" stroke-width="2.5" marker-end="url(#mps-arrow)"/><path d="M480 464 L365 498" fill="none" stroke="#172b3a" stroke-width="2.5" marker-end="url(#mps-arrow)"/><rect x="130" y="500" width="390" height="48" rx="10" fill="#ffffff" stroke="#819eac" stroke-width="2" /><text x="325" y="531" text-anchor="middle" font-size="23" fill="#172b3a" >GPU hardware scheduler</text><path d="M325 550 V568" fill="none" stroke="#172b3a" stroke-width="2.5" marker-end="url(#mps-arrow)"/><rect x="50" y="572" width="550" height="104" rx="10" fill="#ffffff" stroke="#819eac" stroke-width="2" /><text x="325" y="597" text-anchor="middle" font-size="22" fill="#172b3a" font-weight="700" >Shared SMs</text><rect x="66" y="610" width="110" height="50" rx="10" fill="#ffffff" stroke="#819eac" stroke-width="2" /><text x="121" y="630" text-anchor="middle" font-size="18" fill="#172b3a" font-weight="700" >SM</text><rect x="74" y="636" width="44" height="18" rx="10" fill="#f5d4de" stroke="#f46b68" stroke-width="2" /><rect x="124" y="636" width="44" heigh