ddle" font-size="22" fill="#172b3a" font-weight="700" >GPU (H100)</text><rect x="700" y="65" width="270" height="80" rx="10" fill="url(#mps-panel)" stroke="#57929a" stroke-width="2" /><text x="835" y="95" text-anchor="middle" font-size="21" fill="#172b3a" font-weight="700" >MPS control daemon</text><text x="835" y="126" text-anchor="middle" font-size="20" fill="#172b3a" >Starts/stops server</text><path d="M835 147 V169" fill="none" stroke="#172b3a" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#mps-arrow)"/><rect x="700" y="175" width="270" height="130" rx="10" fill="url(#mps-panel)" stroke="#57929a" stroke-width="2" /><text x="835" y="207" text-anchor="middle" font-size="24" fill="#172b3a" font-weight="700" >MPS server</text><text x="835" y="243" text-anchor="middle" font-size="18" fill="#172b3a" >Shared scheduling resources</text><text x="835" y="279" text-anchor="middle" font-size="18" fill="#172b3a" >Client management + cleanup</text><path d="M698 220 H652 V56 H325 V285 H292" fill="none" stroke="#172b3a" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#mps-arrow)"/><path d="M698 270 H664 V285 H602" fill="none" stroke="#172b3a" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#mps-arrow)"/><text x="835" y="341" text-anchor="middle" font-size="18" fill="#172b3a" >Driver allocates connections</text><text x="835" y="366" text-anchor="middle" font-size="18" fill="#172b3a" >from a shared pool</text><text x="835" y="424" text-anchor="middle" font-size="23" fill="#172b3a" font-weight="700" >Concurrent execution</text><text x="721" y="454" text-anchor="middle" font-size="19" fill="#172b3a" >Time</text><path d="M760 448 H962" fill="none" stroke="#172b3a" stroke-width="2.5" marker-end="url(#mps-arrow)"/><rect x="690" y="470" width="280" height="110" rx="10" fill="#ffffff" stroke="#57929a" stroke-width="2" /><text x="714" y="508" text-anchor="middle" font-size="22" fill="#172b3a" font-weight="700" >A</text><text x="714" y="560" text-anchor="mi