<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="655" viewBox="0 0 1000 655" role="img" aria-labelledby="mig-title mig-desc" style="font-family:Arial,Helvetica,sans-serif">
<title id="mig-title">MIG resource paths within two GPU instances</title><desc id="mig-desc">The two 3g.40gb instances used in this experiment are shown as separate coral and green rows inside one H100. Each has a system pipe, isolated control and data crossbar ports, 46 SMs, L2 cache banks, memory controllers and 40 GB HBM. The small SM tiles are schematic, not an SM count.</desc>
<defs><linearGradient id="mig-panel" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eef5f7"/></linearGradient><marker id="mps-arrow" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#172b3a"/></marker></defs>
<rect width="1000" height="655" fill="#f7fafb"/>
